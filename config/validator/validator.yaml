# config/validator/validator.yaml
App\Entity\Location:
    properties:
        name:
            - NotBlank:
                  message: 'The name of the city is required.'
                  groups: ['create']
        latitude:
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'This value should be between {{ min }} and {{ max }}.'
                  groups: ['create']
        longitude:
            - Range:
                  min: -180
                  max: 180
                  groups: ['create']

App\Entity\Forecast:
    properties:
        date:
            - NotBlank:
                  message: 'The date of forecast is required.'
                  groups: ['create']
        temperature:
            - NotBlank:
                  message: 'The temperature is required.'
                  groups: ['create']
        location:
            - NotNull:
                  message: 'You should assign a forecast to the location.'
                  groups: ['create']
